onboarding = false
# herdr configuration
# Place this file at ~/.config/herdr/config.toml

[theme]
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine,
#                  vesper
name = "gruvbox"

auto_switch = false

[terminal]
# Open new tabs and panes in the current directory (matches tmux -c "#{pane_current_path}")
new_cwd = "follow"

[update]
channel = "stable"

[keys]
# Ergonomic Prefix (Changes C-b to C-Space)
prefix = "ctrl+space"

# Tmux-style
split_vertical = "prefix+%"
split_horizontal = "prefix+\""
new_tab = "prefix+c"
new_workspace = "prefix+shift+n"
rename_tab = "prefix+,"
rename_workspace = "prefix+$"

# Disable unused key
focus_pane_down = ""
focus_pane_up = ""
focus_pane_left = ""
focus_pane_right = ""
close_tab = ""
cycle_pane_next = ""
cycle_pane_previous = ""
last_pane = "prefix+o"
navigate_pane_left = ""
navigate_pane_up = ""
navigate_pane_right = ""
navigate_pane_down = ""
swap_pane_left = ""
swap_pane_right = ""
swap_pane_down = ""
swap_pane_up = ""

switch_workspace = "prefix+shift+1..9"
switch_tab = "prefix+1..9"  # Ensures window switching matches base-index 1 behavior

[[keys.command]]
key = "prefix+a"  # "attention" — change if it collides
type = "plugin_action"
command = "attention.jump.next"
description = "jump to next agent needing attention"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_collapsed_mode = "compact"

# Global configuration (Matches set -g mouse on)
mouse_capture = true
redraw_on_focus_gained = false
mouse_scroll_lines = 3
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[advanced]
scrollback_limit_bytes = 15000000

[experimental]
switch_ascii_input_source_in_prefix = true
