# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
# JankyBorders has a built-in detection of already running process,
# so it won't be run twice on AeroSpace restart
after-startup-command = ["exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0"]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = "tiles"

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = "auto"

# Mouse follows focus when focused monitor changes
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]

# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = "qwerty"

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
[mode.main.binding]
cmd-h = "macos-native-minimize"
cmd-alt-h = []  # Disable "hide others"
alt-shift-9 = "flatten-workspace-tree"  # Flatten the tree of the focused workspace
alt-shift-f = "fullscreen"  # Toggle fullscreen Disable alt-f as is is word backward in emacs
alt-s = "layout v_accordion"  # 'layout stacking' in i3
alt-w = "layout h_accordion"  # 'layout tabbed' in i3
alt-e = "layout tiles"  # 'layout toggle split' in i3
alt-shift-e = "layout horizontal vertical"  # rotate
alt-shift-c = "reload-config"
alt-shift-r = "exec-and-forget /bin/sh -c '$HOME/.config/aerospace/restore-workspaces.py'"  # Sort all windows back to their rule-defined workspaces
alt-shift-t = "layout floating tiling"  # 'floating toggle' in i3
alt-r = "mode resize"
alt-f = "exec-and-forget aerospace list-windows --workspace focused --interactive --fzf | aerospace focus --window-id -"  # find window

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
# See: https://nikitabobko.github.io/AeroSpace/commands#move
# See: https://nikitabobko.github.io/AeroSpace/commands#join-with
# inner monitor movement
alt-h = "focus left --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace"
alt-j = "focus down --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace"
alt-k = "focus up --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace"
alt-l = "focus right --boundaries all-monitors-outer-frame --boundaries-action wrap-around-the-workspace"
alt-o = "focus-back-and-forth"
alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"
alt-ctrl-h = "join-with left"
alt-ctrl-j = "join-with down"
alt-ctrl-k = "join-with up"
alt-ctrl-l = "join-with right"
alt-shift-left = "move-node-to-monitor --focus-follows-window left"
alt-shift-down = "move-node-to-monitor --focus-follows-window down"
alt-shift-up = "move-node-to-monitor --focus-follows-window up"
alt-shift-right = "move-node-to-monitor --focus-follows-window right"

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
# Mnemonic workspaces: T=Terminal/Development, B=Browser/web (work), C=Communication,
#                      P=Personal, N=Notes, U=Utilities
# NOTE: alt-d is intentionally unbound — reserved for Raycast (set in Raycast settings)
alt-t = "workspace T --auto-back-and-forth"
alt-b = "workspace B --auto-back-and-forth"
alt-c = "workspace C --auto-back-and-forth"
alt-p = "workspace P --auto-back-and-forth"
alt-n = "workspace N --auto-back-and-forth"
alt-u = "workspace U --auto-back-and-forth"

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-ctrl-t = ["move-node-to-workspace T", "workspace T"]
alt-ctrl-b = ["move-node-to-workspace B", "workspace B"]
alt-ctrl-c = ["move-node-to-workspace C", "workspace C"]
alt-ctrl-p = ["move-node-to-workspace P", "workspace P"]
alt-ctrl-n = ["move-node-to-workspace N", "workspace N"]
alt-ctrl-u = ["move-node-to-workspace U", "workspace U"]

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = "workspace-back-and-forth"
alt-equal = "balance-sizes"

# Application related configurations
alt-enter = "exec-and-forget open -n /Applications/WezTerm.app"  # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget

[mode.resize.binding]  # 2. Declare 'resize' binding mode
h = "resize width -50"
j = "resize height +50"
k = "resize height -50"
l = "resize width +50"
enter = "mode main"
esc = "mode main"

[workspace-to-monitor-force-assignment]
T = "main"
B = "secondary"
C = "main"
P = "secondary"
N = "secondary"
U = "main"

[[on-window-detected]]
if.app-id = "com.github.wez.wezterm"
run = "move-node-to-workspace T"  # mnemonics T - Terminal/Development stuffs

[[on-window-detected]]
if.app-id = "com.mitchellh.ghostty"
# mnemonics T - Terminal/Development stuffs
run = ["move-node-to-workspace T", "layout tiling"]

[[on-window-detected]]
if.app-id = "sh.rexa.Rexa"
# mnemonics T - Terminal/Development stuffs
run = "move-node-to-workspace T"

[[on-window-detected]]
if.app-id = "org.mozilla.firefox"
run = "move-node-to-workspace B"  # mnemonics B - Browser and web stuffs

[[on-window-detected]]
if.app-id = "com.brave.Browser"
run = "move-node-to-workspace P"  # mnemonics P - Personal stuffs

[[on-window-detected]]
if.app-id = "com.apple.WebKit.WebContent"
run = ["layout floating", "move-node-to-workspace P"]

[[on-window-detected]]
if.app-id = "us.zoom.xos"
run = "move-node-to-workspace B"  # mnemonics B - Web stuffs for work

[[on-window-detected]]
if.app-id = "com.tinyspeck.slackmacgap"
run = "move-node-to-workspace C"  # mnemonics C - Communication stuffs

[[on-window-detected]]
if.app-id = "md.obsidian"
run = "move-node-to-workspace N"  # mnemonics N - Note stuffs

[[on-window-detected]]
if.app-id = "com.apple.systempreferences"
# mnemonics U - Utilities stuffs
run = ["layout floating", "move-node-to-workspace U"]

[[on-window-detected]]
if.app-id = "com.apple.ActivityMonitor"
run = "move-node-to-workspace U"  # mnemonics U - Utilities stuffs

[[on-window-detected]]
if.app-id = "com.zscaler.zscaler"
run = "move-node-to-workspace U"  # mnemonics U - Utilities stuffs

[[on-window-detected]]
if.app-id = "com.apple.finder"
run = "move-node-to-workspace U"  # mnemonics U - Utilities stuffs

[[on-window-detected]]
if.app-id = "org.pqrs.Karabiner-Elements.Settings"
run = "move-node-to-workspace U"  # mnemonics U - Utilities stuffs
